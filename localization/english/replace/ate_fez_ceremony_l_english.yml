 ate_fez_ceremony.1009.a.success.tt:0 "DEBUG: the parade goes on, the crowd cheers"
 ate_fez_ceremony.1009.a.success.toast:0 "DEBUG #9: the parade goes on, the crowd cheers"
 ate_fez_ceremony.1009.a.ill.tt:0 "DEBUG: a guest falls ill"
 ate_fez_ceremony.1009.a.ill.toast:0 "DEBUG #9: a guest falls ill"
 ate_fez_ceremony.1009.b:0 "b) Move it indoors (you: -10 prestige)"
 ate_fez_ceremony.1009.c:0 "c) Pray for the storm to pass (learning duel vs 10)"
 ate_fez_ceremony.1009.c.success.tt:0 "DEBUG: the storm passes (+piety)"
 ate_fez_ceremony.1009.c.success.toast:0 "DEBUG #9: the storm passes (+piety)"
 ate_fez_ceremony.1009.c.failure.tt:0 "DEBUG: it keeps raining (+stress)"
 ate_fez_ceremony.1009.c.failure.toast:0 "DEBUG #9: it keeps raining (+stress)"

 ate_fez_ceremony.1010.t:0 "The Scaly Son"
 ate_fez_ceremony.1010.desc:0 "A day to remember. The sun is high, the birds sing, [ROOT.Char.Custom('AteGatorName')] is walking around happily, and the parade and the children are scared... The parade and the children are scared? What's wrong? I ask the people around me. [ate_fez_guest.GetFirstNameNoTooltip]'s scared voice gives it to me plainly: \"Are you sure it's a good idea to let [ROOT.Char.Custom('AteGatorName')] roam that freely?\"\n\nThen I look at the people around me. It looks like not everyone is used to having a two-ton, scaly, toothed death machine walking beside them (the pusillanimous lot). The people in the procession are starting to get uncomfortable, as my scaly boy starts to growl and move more and more violently (aww, look at him, he's so happy to be here).\n\nLooks like something needs to be done."
 ate_fez_ceremony.1010.desc.no_guest:0 "A day to remember. The sun is high, the birds sing, [ROOT.Char.Custom('AteGatorName')] is walking around happily, and the parade and the children are scared... The parade and the children are scared? What's wrong? I ask the people around me. My subject says there is nothing wrong. He is clearly giving me a distracted answer, his attention fixed on every movement of [ROOT.Char.Custom('AteGatorName')].\n\nThen I look at the people around me. It looks like not everyone is used to having a two-ton, scaly, toothed death machine walking beside them (the pusillanimous lot). The people in the procession are starting to get uncomfortable, as my scaly boy starts to growl and move more and more violently (aww, look at him, he's so happy to be here).\n\nLooks like something needs to be done."
 ate_fez_ceremony.1010.a:0 "Dress him in some fine garments and send him to the head of the procession."
 ate_fez_ceremony.1010.a.success.tt:0 "The gator walks the parade fabulously."
 ate_fez_ceremony.1010.a.success.toast:0 "A sight to behold"
 ate_fez_ceremony.1010.a.bite.tt:0 "One of the guests gets his arm bitten while trying to put the garments on him."
 ate_fez_ceremony.1010.a.bite.toast:0 "Treat him gently, you fool!"
 ate_fez_ceremony.1010.b:0 "This moment is about the children, not about me and my gator. Sorry, [ROOT.Char.Custom('AteGatorName')]."
 ate_fez_ceremony.1010.b.toast:0 "The gator goes back to its cage"
 ate_fez_ceremony.1010.c:0 "[ROOT.Char.Custom('AteGatorName')] is part of the family at this point. I think it's long overdue that he gets his fez ritual as well."
 ate_fez_ceremony.1010.c.toast:0 "The religion is up for interpretation"
 ate_fez_every_zealous_shriner_guest_tt:0 "Every zealous Shriner at the party"
 ate_fez_every_other_guest_tt:0 "Everyone else at the party"
 ate_fez_every_outsider_guest_tt:0 "Every guest from outside your family"
 ate_fez_every_family_guest_tt:0 "Your family at the party"
 ate_fez_friend_laughed_off_fez:0 "DEBUG: [CHARACTER.GetShortUIName|U] laughed it off when [TARGET_CHARACTER.GetShortUIName] stepped on his fez."
 ate_fez_friend_laughed_off_fez_corresponding:0 "DEBUG: [TARGET_CHARACTER.GetShortUIName|U] laughed it off when [CHARACTER.GetShortUIName] stepped on his fez."

 ate_fez_ceremony.1011.t:0 "DEBUG #11: Not My Father's Fez"
 ate_fez_ceremony.1011.desc:0 "DEBUG ate_fez_ceremony.1011 | pool: Banquet | scale: any\nWard (attending honoree, not your child): [ate_fez_ward.GetFirstNameNoTooltip]\nHis father (if alive): [ate_fez_ward_father.GetFirstNameNoTooltip]\nHe got the fez from his guardian, not his father."
 ate_fez_ceremony.1011.desc.no_ward_father:0 "DEBUG ate_fez_ceremony.1011 | pool: Banquet | scale: any | (no ward_father)\nWard (attending honoree, not your child): [ate_fez_ward.GetFirstNameNoTooltip]\nHe got the fez from his guardian, not his father."
 ate_fez_ceremony.1011.a:0 "a) I am your father now (ward: +30 opinion | his father: -20 opinion)"
 ate_fez_ceremony.1011.b:0 "b) Your father would be proud (ward: +10 opinion | his father: +10 opinion)"
 ate_fez_ceremony.1011.c:0 "c) Say nothing (ward: -10 opinion)"

 ate_fez_ceremony.1012.t:0 "DEBUG #12: The Ward's Gift"
 ate_fez_ceremony.1012.desc:0 "DEBUG ate_fez_ceremony.1012 | pool: Banquet | scale: any\nWard (attending honoree): [ate_fez_ward.GetFirstNameNoTooltip]\nHis family (father, else mother): [ate_fez_ward_family.GetFirstNameNoTooltip]\nHis family sends a gift to thank you."
 ate_fez_ceremony.1012.a:0 "a) Accept the gift (you: +minor gold | family: +10 opinion)"
 ate_fez_ceremony.1012.b:0 "b) Refuse it graciously (you: +prestige | family: +5 opinion)"
 ate_fez_ceremony.1012.c:0 "c) Ask for a favor instead (you: favor hook on the family | family: -10 opinion)"
 ate_fez_ceremony.1012.c.toast:0 "DEBUG #12: favor hook gained on the family"

 ate_fez_ceremony.1014.t:0 "DEBUG #14: A Suitor's Eye"
 ate_fez_ceremony.1014.desc:0 "DEBUG ate_fez_ceremony.1014 | pool: Banquet | scale: any\nDaughter (attending, under-age, free to marry): [ate_fez_daughter.GetFirstNameNoTooltip]\nGuest of rank (count or higher): [ate_fez_suitor_family.GetFirstNameNoTooltip]\nProposed match (his child): [ate_fez_match.GetFirstNameNoTooltip]"
 ate_fez_ceremony.1014.a:0 "a) Accept the betrothal (guest: +20 opinion)"
 ate_fez_ceremony.1014.a.toast:0 "DEBUG #14: betrothal arranged"
 ate_fez_ceremony.1014.b:0 "b) Decline politely (guest: -10 opinion)"

 ate_fez_ceremony.1015.t:0 "DEBUG #15: The Sister Who Stole the Show"
 ate_fez_ceremony.1015.desc:0 "DEBUG ate_fez_ceremony.1015 | pool: Banquet | scale: any\nDaughter (attending, under-age): [ate_fez_daughter.GetFirstNameNoTooltip]\nOne of the brothers: [ate_fez_target_boy.GetFirstNameNoTooltip]\nShe outshines the ceremony."
 ate_fez_ceremony.1015.desc.no_target_boy:0 "DEBUG ate_fez_ceremony.1015 | pool: Banquet | scale: any | (no target_boy)\nDaughter (attending, under-age): [ate_fez_daughter.GetFirstNameNoTooltip]\nShe outshines the ceremony."
 ate_fez_ceremony.1015.a:0 "a) Praise her (you: +prestige | her: +15 opinion | every attending honoree: -5 opinion)"
 ate_fez_ceremony.1015.a.toast:0 "DEBUG #15: she steals the show (the brothers resent it)"
 ate_fez_ceremony.1015.b:0 "b) Hush her, it is the boys' day (her: -10 opinion)"
 ate_fez_ceremony.1015.b.toast:0 "DEBUG #15: she is hushed"

 ate_fez_ceremony.1017.t:0 "DEBUG #17: Heavy Is the Fez"
 ate_fez_ceremony.1017.desc:0 "DEBUG ate_fez_ceremony.1017 | pool: Procession | scale: any\nBoy (attending honoree, craven or lazy): [ate_fez_target_boy.GetFirstNameNoTooltip]\nYou find him crying: he doesn't want the fez, he doesn't want to be an adult."
 ate_fez_ceremony.1017.a:0 "a) Convince him (diplomacy duel vs 10 | failure: he skips the rite)"
 ate_fez_ceremony.1017.a.success.tt:0 "DEBUG: he agrees (+10 opinion)"
 ate_fez_ceremony.1017.a.success.toast:0 "DEBUG #17: he agrees (+10 opinion)"
 ate_fez_ceremony.1017.a.failure.tt:0 "DEBUG: he refuses and skips the rite (off the honoree list | -10 opinion)"
 ate_fez_ceremony.1017.a.failure.toast:0 "DEBUG #17: he refuses and skips the rite (off the honoree list | -10 opinion)"
 ate_fez_ceremony.1017.b:0 "b) Force him (keeps the fez | him: -20 opinion | stress: compassionate gain)"
 ate_fez_ceremony.1017.c:0 "c) Beat him (keeps the fez | him: -30 opinion | stress: compassionate gain, sadistic loss)"
 ate_fez_ceremony.1017.d.drunkard:0 "d) Drunkard: share a drink with him (30%: he catches Drunkard | keeps the fez | him: +10 opinion)"
 ate_fez_ceremony.1017.d.hashishiyah:0 "d) Hashishiyah: share your pipe with him (30%: he catches Hashishiyah | keeps the fez | him: +10 opinion)"
 ate_fez_ceremony.1017.d.comfort_eater:0 "d) Comfort Eater: feed him until he forgets his fears (30%: he catches Comfort Eater | keeps the fez | him: +10 opinion)"
 ate_fez_ceremony.1017.d.gluttonous:0 "d) Gluttonous: a feast for two (30%: he catches Comfort Eater | keeps the fez | him: +10 opinion)"
 ate_fez_ceremony.1017.d.profligate:0 "d) Profligate: take him on a spending spree (30%: he catches Profligate | keeps the fez | him: +10 opinion)"
 ate_fez_ceremony.1017.d.greedy:0 "d) Greedy: show him your treasury (30%: he catches Greedy (only with a free personality slot) | keeps the fez | him: +10 opinion)"
 ate_fez_ceremony.1017.d.lifestyle_reveler:0 "d) Reveler: take him to a real party (30%: he catches Reveler | keeps the fez | him: +10 opinion)"
 ate_fez_ceremony.1017.d.caught.tt:0 "DEBUG: he catches your vice"
 ate_fez_ceremony.1017.d.enjoyed.tt:0 "DEBUG: he enjoys it, but does not pick up the habit"
 ate_fez_ceremony.1017.d.caught.toast:0 "DEBUG #17: he caught your vice"
 ate_fez_ceremony.1017.d.enjoyed.toast:0 "DEBUG #17: he enjoyed it, but did not pick up the habit"
 ate_fez_ceremony.1017.e:0 "e) Let him skip the rite (off the honoree list | him: +5 opinion)"
 ate_fez_ceremony.1017.e.toast:0 "DEBUG #17: he skips the rite (off the honoree list)"
 ate_fez_ceremony.1017.f:0 "f) Cannibal: show him what you really eat (only: cannibal | keeps the fez | him: -30 opinion)"
 ate_fez_ceremony.1017.f.toast:0 "THE FUCK IS WRONG WITH YOU"

 ate_fez_ceremony.1018.t:0 "DEBUG #18: When in al-Rome..."
 ate_fez_ceremony.1018.desc:0 "DEBUG ate_fez_ceremony.1018 | pool: Procession | scale: any\nWard (attending, non-Shriner, 12-15): [ate_fez_foreign_ward.GetFirstNameNoTooltip]\nHe asks what you people are doing and whether he can have his fez as well."
 ate_fez_ceremony.1018.a:0 "a) Convert him and give him the fez (he becomes Shriner | joins the honoree list | him: +15 opinion)"
 ate_fez_ceremony.1018.a.toast:0 "DEBUG #18: he converts and joins the honorees"
 ate_fez_ceremony.1018.b:0 "b) Not today (him: -10 opinion)"

 ate_fez_ceremony.1019.t:0 "DEBUG #19: Like the First Time"
 ate_fez_ceremony.1019.desc:0 "DEBUG ate_fez_ceremony.1019 | pool: Banquet | scale: any\nBoy (attending honoree): [ate_fez_target_boy.GetFirstNameNoTooltip]\nDead ancestor of your dynasty: [ate_fez_ancestor.GetFirstNameNoTooltip]\nHe says he has lived this before."
 ate_fez_ceremony.1019.a:0 "a) Believe him (him: Reincarnation trait, linked to the ancestor)"
 ate_fez_ceremony.1019.a.toast:0 "DEBUG #19: he is a reincarnation"
 ate_fez_ceremony.1019.b:0 "b) Don't believe him (him: Lunatic)"
 ate_fez_ceremony.1019.b.toast:0 "DEBUG #19: he is called a lunatic"

