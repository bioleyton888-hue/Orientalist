 ate_fez_ceremony.1001.t:0 "Zub-dah Fingers"
 ate_fez_ceremony.1001.desc:0 "My son, my boy, a little clumsier than most, had a fez too large, and it accidentally (I hope) fell from his head to the floor. With such bad timing, he also stepped on it, carried by the momentum. The fez is now ruined. The silent crowd and I let out a surprised, unified gasp, and the silence turns from respectful to uncomfortable to unbearable.\n\n[ate_fez_target_boy.GetFirstNameNoTooltip], pale as a ghost, stiff as a board, and with his foot still on the fez, starts looking at me..."
 ate_fez_ceremony.1001.a:0 "\"Hahaha, that's not how you adjust the fez to your head, my boy.\""
 ate_fez_ceremony.1001.b:0 "I violently pull the stomped fez from under his foot and put the damaged fez on his head."
 ate_fez_ceremony.1001.c:0 "I clap my hands, and immediately the servants bring a new fez."
 ate_fez_ceremony.1001.b.tt:0 "Your son wears a broken fez."
 ate_fez_ceremony.1001.d:0 "\"It looks like the fez didn't lose its elasticity. A simple push from the inside and it's like new.\""
 ate_fez_ceremony.1001.a.toast:0 "DEBUG #1: you and the boy grow closer"

