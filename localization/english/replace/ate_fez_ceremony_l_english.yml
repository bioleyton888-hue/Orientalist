 ate_fez_ceremony.1008.t:0 "An Unusual Sight, All Too Common"
 ate_fez_ceremony.1008.desc:0 "I knew this procession was going too well to be true, until I heard a screaming man rushing toward us. I don't know why this kind of behavior is so common on this peninsula; maybe it's the water, or the number of djinn in the swamp, but this place seems to breed an eccentric bunch of people. We have been calling them Florida Men since before my grandfather was born.\n\nThis one in particular is completely naked and clearly drunk. I rally the adults and the guards to protect the children. He stamps and forces his way between the guards and starts pleading with me, in tears. \"PLEEEASE,\" he says, \"I didn't mean to kill him! You have to save him!\" He then points at a human-sized straw man he seems to be carrying. I can see genuine remorse and pain in his eyes. I can also see that the moment will soon descend into chaos if I don't do something about it."
 ate_fez_ceremony.1008.a:0 "Go to the nearest Lodge you can find. Tell them I sent you; they will treat him there."
 ate_fez_ceremony.1008.b:0 "OUT OF MY WAY, YOU DRUNKEN FOOL!"
 ate_fez_ceremony.1008.c:0 "There is nothing we can do. Join us; we will hold a funeral after my son's ceremony."
 ate_fez_ceremony.1008.a.toast:0 "Now it's someone else's problem"
 ate_fez_ceremony.1008.d:0 "I slit his throat before he utters any more nonsense."
 ate_fez_ceremony.1008.d.toast:0 "The children saw that"
 ate_fez_ceremony.1008.e:0 "MEEEEDIC... MEEEEDIC!"
 ate_fez_ceremony.1008.e.toast:0 "Now it's everyone's problem"

 ate_fez_ceremony.1009.t:0 "DEBUG #9: The Storm"
 ate_fez_ceremony.1009.desc:0 "DEBUG ate_fez_ceremony.1009 | pool: Procession | scale: Extravagant\nGuest at risk (optional): [ate_fez_guest.GetFirstNameNoTooltip]\nA hurricane-season squall hits the open-air parade."
 ate_fez_ceremony.1009.desc.no_guest:0 "DEBUG ate_fez_ceremony.1009 | pool: Procession | scale: Extravagant | (no guest)\nA hurricane-season squall hits the open-air parade."
