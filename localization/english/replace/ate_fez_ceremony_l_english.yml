l_english:

 # The Feast of the Fez — activity_ate_fez_ceremony
 activity_ate_fez_ceremony:0 "Feast of the Fez"
 activity_ate_fez_ceremony_name:0 "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Feast of the Fez"
 activity_ate_fez_ceremony_desc:0 "A boy does not become a Shriner on his own. Call every son and ward of age before the Lodge at once, place the crimson fez upon each head, and let the oaths be spoken aloud before the whole family."
 activity_ate_fez_ceremony_selection_tooltip:0 "Present the fez to every eligible son and ward at once.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$Every attending son and ward gains [GetModifier('ate_shriner_initiated_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Loss"
 activity_ate_fez_ceremony_host_desc:0 "$BULLET_WITH_TAB$Every attending son and ward is initiated into the Lodge\n$BULLET_WITH_TAB$May gain [prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$May have [stress_loss_i] [stress|E] Loss"
 activity_ate_fez_ceremony_guest_desc:0 "As a guest at the Feast of the Fez, I will watch the host's boys receive the fez and swear the oaths of the Lodge. It is a family affair, warm and loud, and the food is good."
 activity_ate_fez_ceremony_guest_help_text:0 "$activity_ate_fez_ceremony$"
 activity_ate_fez_ceremony_conclusion_desc:0 "The [GetActivityType( 'activity_ate_fez_ceremony' ).GetName] is over. The boys who walked into the Lodge hall are not the same ones who walked out."
 activity_ate_fez_ceremony_province_desc:0 "Your Lodge Hall"
 activity_ate_fez_ceremony_destination_selection:0 "The fez is presented in the Lodge hall at your [capital|E]."
 activity_ate_fez_ceremony_predicted_cost:0 "The cost of the Feast of the Fez depends on its scale."

 # Phases
 ate_fez_phase_procession:0 "The Procession"
 ate_fez_phase_procession_desc:0 "The boys walk into the Lodge hall before the whole family."
 ate_fez_phase_presentation:0 "The Presentation"
 ate_fez_phase_presentation_desc:0 "Each boy is called forward, the fez is placed upon his head, and the oaths of the Lodge are spoken."
 ate_fez_phase_banquet:0 "The Banquet"
 ate_fez_phase_banquet_desc:0 "The fez is given. Now the feast."

 # Options
 ate_fez_party_scale:0 "Scale"
 ate_fez_scale_modest:0 "Modest"
 ate_fez_scale_modest_desc:0 "$EFFECT_LIST_BULLET$ A private ceremony in the Lodge hall, for the family alone.\n$EFFECT_LIST_BULLET$ Up to #V 12#! guests\n$EFFECT_LIST_BULLET$ You gain [prestige_i] [prestige|E] and lose [stress|E]\n\n#weak It is not a long ceremony. It does not need to be.#!"
 ate_fez_scale_grand:0 "Grand"
 ate_fez_scale_grand_desc:0 "$EFFECT_LIST_BULLET$ The whole court is called to witness, and every brother of the Lodge.\n$EFFECT_LIST_BULLET$ Up to #V 25#! guests\n$EFFECT_LIST_BULLET$ You gain more [prestige_i] [prestige|E] and [piety_i] [piety|E]\n$EFFECT_LIST_BULLET$ The boys gain [opinion|E] of you\n$EFFECT_LIST_BULLET$ Bigger intent rewards\n\n#weak Let every brother of the Lodge bear witness to this.#!"
 ate_fez_scale_extravagant:0 "Extravagant"
 ate_fez_scale_extravagant_desc:0 "$EFFECT_LIST_BULLET$ A parade through the city: drums, banners, and every boy in crimson. The [gold|E] cost grows with every boy honored.\n$EFFECT_LIST_BULLET$ Up to #V 40#! guests\n$EFFECT_LIST_BULLET$ You gain much more [prestige_i] [prestige|E], [dynasty_prestige_i] [dynasty_prestige|E] and [GetModifier('ate_fez_talk_of_the_lodge_modifier').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ The boys gain [opinion|E] of you and [GetModifier('ate_fez_presented_great_feast_modifier').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ The biggest intent rewards\n\n#weak If the city is not talking about it for a year, it was not big enough.#!"
 ate_fez_cost_per_boy:0 "Per boy honored"

 # Intents
 ate_fez_party_intent:0 "An Excuse to Party"
 ate_fez_party_intent_desc:0 "The boys get their fez, and I get a feast. Everybody wins.\n\n$EFFECT_LIST_BULLET$ [stress_loss_i] [stress|E] Loss at the end of the party, more the bigger the party"
 ate_fez_important_intent:0 "This Is Important"
 ate_fez_important_intent_desc:0 "This is a rite of the Lodge, not a banquet. I will treat it as one.\n\n$EFFECT_LIST_BULLET$ [piety_i] [piety|E] at the end of the party, more the bigger the party"
 ate_fez_look_intent:0 "Everybody Look"
 ate_fez_look_intent_desc:0 "The whole court is here. Let them see.\n\n$EFFECT_LIST_BULLET$ [prestige_i] [prestige|E] at the end of the party, more the bigger the party"

 # Invite rule
 activity_invite_rule_ate_fez_honorees:0 "The Boys"
 activity_invite_rule_ate_fez_honorees_desc:0 "Every son and ward who will receive the fez. They cannot be left out of their own ceremony."

 # Conclusion log entries
 ate_fez_honorees_log_title:0 "The Fez Is Given"
 ate_fez_honorees_log:0 "[CHARACTER.GetShortUIName|U] presented the fez to the boys of the family"
 ate_fez_every_honoree_tt:0 "Every attending son and ward"
 ate_fez_intent_reward_log_title:0 "$final_reward_tt$"
 ate_fez_intent_reward_log:0 "[CHARACTER.GetShortUIName|U] got what [CHARACTER.GetSheHe] came for"

 # Modifiers
 ate_fez_talk_of_the_lodge_modifier:0 "Talk of the Lodge"
 ate_fez_talk_of_the_lodge_modifier_desc:0 "This character threw an Extravagant Feast of the Fez, and every Lodge in the land is still talking about it."
 ate_fez_presented_great_feast_modifier:0 "Presented at the Great Feast"
 ate_fez_presented_great_feast_modifier_desc:0 "This character received the fez at an Extravagant Feast of the Fez, paraded through the city before the whole Lodge."
 ate_fez_presented_by_father_opinion:0 "Gave Me the Fez"

 # Events — ate_fez_ceremony.0001 The Procession
 ate_fez_ceremony.0001.t:0 "The Procession"
 ate_fez_ceremony.0001.desc.modest:0 "The doors of the Lodge hall open. The boys come in one after another, scrubbed and combed, in their best clothes, trying very hard to walk like men. The family is already seated. Nobody says anything. Nobody needs to."
 ate_fez_ceremony.0001.desc.grand:0 "The whole court has come. Vassals, cousins, and the brothers of the Lodge in their crimson fezzes all rise as the boys enter the hall in a line, the youngest at the back, every one of them trying very hard to walk like a man."
 ate_fez_ceremony.0001.desc.extravagant:0 "The parade starts at the city gate. Drums, banners, horns, and the brothers of the Lodge in crimson marching ahead of the boys, while the whole city leans out of its windows to watch. By the time the procession reaches the Lodge hall, half the city is following it."
 ate_fez_ceremony.0001.desc.elephant:0 "\n\nAt its head, swaying under a gilded howdah, walks the parade elephant. The boys cannot stop looking at it. Neither can anyone else."
 ate_fez_ceremony.0001.a:0 "Let them come in."

 # Events — ate_fez_ceremony.0002 The Presentation
 ate_fez_ceremony.0002.t:0 "The Presentation"
 ate_fez_ceremony.0002.desc.none:0 "The fezzes wait on their cushions, crimson felt and black tassels, one for each boy. But the boys are not here. The hall waits, and the brothers of the Lodge look at one another, and then at you."
 ate_fez_ceremony.0002.desc.one:0 "The hall falls quiet when you call [ate_fez_boy_1.GetFirstNameNoTooltip] forward. He stands straight; he has been practicing. The fez is placed in his hands. The words of the Lodge are spoken. He puts it on. It is slightly too large. He does not take it off."
 ate_fez_ceremony.0002.desc.several:0 "One by one, you call them forward: [ate_fez_boy_1.GetFirstNameNoTooltip], [ate_fez_boy_2.GetFirstNameNoTooltip], and the others after them. Each one stands as straight as he can. Each one receives the fez, crimson felt and black tassel, the same as every other, and hears the words of the Lodge spoken over him.\n\nEvery fez is slightly too large. Not one of them comes off."
 ate_fez_ceremony.0002.desc.many:0 "There are so many of them that the brothers of the Lodge have to bring a second table for the fezzes. [ate_fez_boy_1.GetFirstNameNoTooltip] first, then [ate_fez_boy_2.GetFirstNameNoTooltip], then the rest of the line, all the way to the back of the hall. The words of the Lodge are spoken so many times that the guests start saying them along.\n\nEvery fez is slightly too large. Not one of them comes off."
 ate_fez_ceremony.0002.a:0 "These are the oaths of the Lodge. Mean every word."
 ate_fez_ceremony.0002.b:0 "Look at them. The finest boys in the land."
 ate_fez_ceremony.0002.c:0 "Don't worry. You'll grow into it."
 ate_fez_every_present_boy_tt:0 "Every boy who received the fez"

 # Events — ate_fez_ceremony.0003 The Banquet
 ate_fez_ceremony.0003.t:0 "The Banquet"
 ate_fez_ceremony.0003.desc.none:0 "The tables are full and the cooks have outdone themselves, but the seats kept for the boys stand empty. The feast goes on anyway. It always does. When the cups are raised, the toast is to the fezzes that wait for another day."
 ate_fez_ceremony.0003.desc.one:0 "The tables are full, the cups are full, and at the head of the hall sits [ate_fez_boy_1.GetFirstNameNoTooltip], the fez still on his head, a little crooked by now. When you rise with your cup, the whole hall rises with you."
 ate_fez_ceremony.0003.desc.several:0 "The tables are full, the cups are full, and at the head of the hall sit the boys: [ate_fez_boy_1.GetFirstNameNoTooltip], [ate_fez_boy_2.GetFirstNameNoTooltip], and the others, every fez a little crooked by now. When you rise with your cup, the whole hall rises with you."
 ate_fez_ceremony.0003.a:0 "To the new brothers of the Lodge!"

 # TESTING ONLY — debug decision (remove before release)
 ate_fez_debug_spawn_test_kids:0 "TEST: Spawn Fez Test Children"
 ate_fez_debug_spawn_test_kids_desc:0 "TESTING ONLY. Adds 15 of your children to your court, all aged 13: 11 boys and 4 girls, each with a different pair of personality traits, to test the Feast of the Fez events. They take your faith and culture."
 ate_fez_debug_spawn_test_kids_tooltip:0 "TESTING ONLY: spawn 15 children aged 13 with different traits"
 ate_fez_debug_spawn_test_kids_confirm:0 "Spawn the children"

