 ate_fez_intent_reward_log:0 "[CHARACTER.GetShortUIName|U] got what [CHARACTER.GetSheHe] came for"

 # Modifiers
 ate_fez_talk_of_the_lodge_modifier:0 "Talk of the Lodge"
 ate_fez_talk_of_the_lodge_modifier_desc:0 "This character threw an Extravagant Feast of the Fez, and every Lodge in the land is still talking about it."
 ate_fez_presented_great_feast_modifier:0 "Presented at the Great Feast"
 ate_fez_presented_great_feast_modifier_desc:0 "This character received the fez at an Extravagant Feast of the Fez, paraded through the city before the whole Lodge."
 ate_fez_presented_by_father_opinion:0 "Gave Me the Fez"

 # Events — ate_fez_ceremony.0001 The Procession
 ate_fez_ceremony.0001.t:0 "The Procession"
 ate_fez_ceremony.0001.desc.modest:0 "The fez ritual is an important moment in the life of a Shriner, for it is both a statement of identity to the world and a passage from childhood to adulthood. We have called the masons of the nearest Lodge to this moment, to present my sons to them. The family gathers in silence, and the \"tifls\" stand expectant."
 ate_fez_ceremony.0001.desc.grand:0 "The whole court has come. Vassals, cousins, and the brothers of the Lodge in their crimson fezzes all rise as the boys enter the hall in a line, the youngest at the back, every one of them trying very hard to walk like a man."
 ate_fez_ceremony.0001.desc.extravagant:0 "We are celebrating the adulthood of my sons \"Al-O'grande\". The parade starts at the doors of my castle. Drums, banners, horns, and the brothers of the Lodge in crimson march ahead of the boys, while every city and village we pass leans out of its windows to watch. By the time the procession reaches the Lodge hall, half the city is following it."
 ate_fez_ceremony.0001.desc.elephant:0 "\n\nAt its head, swaying under a gilded howdah, walks the parade elephant. The boys cannot stop looking at it. Neither can anyone else."
 ate_fez_ceremony.0001.a:0 "We proceed."

 # Events — ate_fez_ceremony.0002 The Presentation
 ate_fez_ceremony.0002.t:0 "The Presentation"
 ate_fez_ceremony.0002.desc.none:0 "The fezzes wait on their cushions, crimson felt and black tassels, one for each boy. But the boys are not here. The hall waits, and the brothers of the Lodge look at one another, and then at you."
 ate_fez_ceremony.0002.desc.one:0 "The hall falls quiet when you call [ate_fez_boy_1.GetFirstNameNoTooltip] forward. He stands straight; he has been practicing. You place the fez in his hands. You ask him to take the Lodge oath; he accepts it, and he puts the fez on. It is slightly too large, but he does not take it off."
 ate_fez_ceremony.0002.desc.several:0 "After the Lodge finishes its sermons, you call them forward one by one: [ate_fez_boy_1.GetFirstNameNoTooltip], [ate_fez_boy_2.GetFirstNameNoTooltip], and the others after them. Each one stands as straight as he can. Each one receives the fez, crimson felt and black tassel, the same as every one of us, and hears the words of the Lodge spoken over him.\n\nEvery fez is slightly too large for them, but not one of them takes it off."
 ate_fez_ceremony.0002.desc.many:0 "I've certainly been busy these past years. There are so many of them that the brothers of the Lodge have to bring a second table for the fezzes. [ate_fez_boy_1.GetFirstNameNoTooltip] first, then [ate_fez_boy_2.GetFirstNameNoTooltip], then the rest of the line, all the way to the back of the hall. The oath of the Lodge is spoken so many times that the guests start saying it along.\n\nSome of the fezzes are a little too large for my boys' heads, but they don't take them off."
 ate_fez_ceremony.0002.a:0 "Being a Shriner is more than just wearing the fez. Remember to live by the Lodge oath."
 ate_fez_ceremony.0002.b:0 "Look at them. The finest boys in the land."
 ate_fez_ceremony.0002.c:0 "Don't worry. You'll grow into it."
 ate_fez_every_present_boy_tt:0 "Every boy who received the fez"

 # Events — ate_fez_ceremony.0003 The Banquet
 ate_fez_ceremony.0003.t:0 "The Banquet"
 ate_fez_ceremony.0003.desc.none:0 "The tables are full and the cooks have outdone themselves, but the seats kept for the boys stand empty. The feast goes on anyway. It always does. When the cups are raised, the toast is to the fezzes that wait for another day."
 ate_fez_ceremony.0003.desc.one:0 "The tables are full, the cups are full; a day like this spares no expense. At the head of the hall, my boy, now brother [ate_fez_boy_1.GetFirstNameNoTooltip], his fez on his head, gorges on the ceremonial pancakes made just for him. Then I raise my cup, and the whole hall rises with me."
 ate_fez_ceremony.0003.desc.several:0 "The tables are full, the cups are full, and the seats are full as well. At the head of the hall sit the boys: [ate_fez_boy_1.GetFirstNameNoTooltip], [ate_fez_boy_2.GetFirstNameNoTooltip], and the others, eating, every fez a little crooked by now. That's when I raise my cup, and the whole hall rises with me."
 ate_fez_ceremony.0003.a:0 "\"Fi si-já-tik!\" To the new brothers of the Lodge!"

