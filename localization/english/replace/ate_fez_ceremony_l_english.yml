l_english:

 # The Feast of the Fez — activity_ate_fez_ceremony
 activity_ate_fez_ceremony:0 "Feast of the Fez"
 activity_ate_fez_ceremony_name:0 "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Feast of the Fez"
 activity_ate_fez_ceremony_desc:0 "A boy does not become a Shriner on his own. Call every son and ward of age before the Lodge at once, place the crimson fez upon each head, and let the oaths be spoken aloud before the whole family."
 activity_ate_fez_ceremony_selection_tooltip:0 "Present the fez to every eligible son and ward at once.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$Every attending son and ward gains [GetModifier('ate_shriner_initiated_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Loss"
 activity_ate_fez_ceremony_host_desc:0 "$BULLET_WITH_TAB$Every attending son and ward is initiated into the Lodge\n$BULLET_WITH_TAB$May gain [prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$May have [stress_loss_i] [stress|E] Loss"
 activity_ate_fez_ceremony_guest_desc:0 "As a guest at the Feast of the Fez, I will watch the host's boys receive the fez and swear the oaths of the Lodge. It is a family affair, warm and loud, and the food is good."
 activity_ate_fez_ceremony_guest_help_text:0 "$activity_ate_fez_ceremony$"
 activity_ate_fez_ceremony_conclusion_desc:0 "The [GetActivityType( 'activity_ate_fez_ceremony' ).GetName] is over. The boys who walked into the Lodge hall are not the same ones who walked out."
 activity_ate_fez_ceremony_province_desc:0 "Your Lodge Hall"
 activity_ate_fez_ceremony_destination_selection:0 "The fez is presented in the Lodge hall at your [capital|E]."
 activity_ate_fez_ceremony_predicted_cost:0 "The cost of the Feast of the Fez depends on its scale."

 # Phases
 ate_fez_phase_procession:0 "The Procession"
 ate_fez_phase_procession_desc:0 "The boys walk into the Lodge hall before the whole family."
 ate_fez_phase_presentation:0 "The Presentation"
 ate_fez_phase_presentation_desc:0 "Each boy is called forward, the fez is placed upon his head, and the oaths of the Lodge are spoken."
 ate_fez_phase_banquet:0 "The Banquet"
 ate_fez_phase_banquet_desc:0 "The fez is given. Now the feast."

 # Options
 ate_fez_party_scale:0 "Scale"
 ate_fez_scale_modest:0 "Modest"
 ate_fez_scale_modest_desc:0 "$EFFECT_LIST_BULLET$ A private ceremony in the Lodge hall, for the family alone.\n$EFFECT_LIST_BULLET$ Up to #V 12#! guests\n$EFFECT_LIST_BULLET$ You gain [prestige_i] [prestige|E] and lose [stress|E]\n\n#weak It is not a long ceremony. It does not need to be.#!"
 ate_fez_scale_grand:0 "Grand"
 ate_fez_scale_grand_desc:0 "$EFFECT_LIST_BULLET$ The whole court is called to witness, and every brother of the Lodge.\n$EFFECT_LIST_BULLET$ Up to #V 25#! guests\n$EFFECT_LIST_BULLET$ You gain more [prestige_i] [prestige|E] and [piety_i] [piety|E]\n$EFFECT_LIST_BULLET$ The boys gain [opinion|E] of you\n$EFFECT_LIST_BULLET$ Bigger intent rewards\n\n#weak Let every brother of the Lodge bear witness to this.#!"
 ate_fez_scale_extravagant:0 "Extravagant"
 ate_fez_scale_extravagant_desc:0 "$EFFECT_LIST_BULLET$ A parade through the city: drums, banners, and every boy in crimson. The [gold|E] cost grows with every boy honored.\n$EFFECT_LIST_BULLET$ Up to #V 40#! guests\n$EFFECT_LIST_BULLET$ You gain much more [prestige_i] [prestige|E], [dynasty_prestige_i] [dynasty_prestige|E] and [GetModifier('ate_fez_talk_of_the_lodge_modifier').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ The boys gain [opinion|E] of you and [GetModifier('ate_fez_presented_great_feast_modifier').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ The biggest intent rewards\n\n#weak If the city is not talking about it for a year, it was not big enough.#!"
 ate_fez_cost_per_boy:0 "Per boy honored"

 # Intents
 ate_fez_party_intent:0 "An Excuse to Party"
 ate_fez_party_intent_desc:0 "The boys get their fez, and I get a feast. Everybody wins.\n\n$EFFECT_LIST_BULLET$ [stress_loss_i] [stress|E] Loss at the end of the party, more the bigger the party"
 ate_fez_important_intent:0 "This Is Important"
 ate_fez_important_intent_desc:0 "This is a rite of the Lodge, not a banquet. I will treat it as one.\n\n$EFFECT_LIST_BULLET$ [piety_i] [piety|E] at the end of the party, more the bigger the party"
 ate_fez_look_intent:0 "Everybody Look"
 ate_fez_look_intent_desc:0 "The whole court is here. Let them see.\n\n$EFFECT_LIST_BULLET$ [prestige_i] [prestige|E] at the end of the party, more the bigger the party"

 # Invite rule
 activity_invite_rule_ate_fez_honorees:0 "The Boys"
 activity_invite_rule_ate_fez_honorees_desc:0 "Every son and ward who will receive the fez. They cannot be left out of their own ceremony."

 # Conclusion log entries
 ate_fez_honorees_log_title:0 "The Fez Is Given"
 ate_fez_honorees_log:0 "[CHARACTER.GetShortUIName|U] presented the fez to the boys of the family"
 ate_fez_every_honoree_tt:0 "Every attending son and ward"
 ate_fez_intent_reward_log_title:0 "$final_reward_tt$"
 ate_fez_intent_reward_log:0 "[CHARACTER.GetShortUIName|U] got what [CHARACTER.GetSheHe] came for"

 # Modifiers
 ate_fez_talk_of_the_lodge_modifier:0 "Talk of the Lodge"
 ate_fez_talk_of_the_lodge_modifier_desc:0 "This character threw an Extravagant Feast of the Fez, and every Lodge in the land is still talking about it."
 ate_fez_presented_great_feast_modifier:0 "Presented at the Great Feast"
 ate_fez_presented_great_feast_modifier_desc:0 "This character received the fez at an Extravagant Feast of the Fez, paraded through the city before the whole Lodge."
 ate_fez_presented_by_father_opinion:0 "Gave Me the Fez"

 # Events — ate_fez_ceremony.0001 The Procession
 ate_fez_ceremony.0001.t:0 "The Procession"
 ate_fez_ceremony.0001.desc.modest:0 "The fez ritual is an important moment in the life of a Shriner, for it is both a statement of identity to the world and a passage from childhood to adulthood. We have called the masons of the nearest Lodge to this moment, to present my sons to them. The family gathers in silence, and the \"tifls\" stand expectant."
 ate_fez_ceremony.0001.desc.grand:0 "The whole court has come. Vassals, cousins, and the brothers of the Lodge in their crimson fezzes all rise as the boys enter the hall in a line, the youngest at the back, every one of them trying very hard to walk like a man."
 ate_fez_ceremony.0001.desc.extravagant:0 "We are celebrating the adulthood of my sons \"Al-O'grande\". The parade starts at the doors of my castle. Drums, banners, horns, and the brothers of the Lodge in crimson march ahead of the boys, while every city and village we pass leans out of its windows to watch. By the time the procession reaches the Lodge hall, half the city is following it."
 ate_fez_ceremony.0001.desc.elephant:0 "\n\nAt its head, swaying under a gilded howdah, walks the parade elephant. The boys cannot stop looking at it. Neither can anyone else."
 ate_fez_ceremony.0001.a:0 "We proceed."

 # Events — ate_fez_ceremony.0002 The Presentation
 ate_fez_ceremony.0002.t:0 "The Presentation"
 ate_fez_ceremony.0002.desc.none:0 "The fezzes wait on their cushions, crimson felt and black tassels, one for each boy. But the boys are not here. The hall waits, and the brothers of the Lodge look at one another, and then at you."
 ate_fez_ceremony.0002.desc.one:0 "The hall falls quiet when you call [ate_fez_boy_1.GetFirstNameNoTooltip] forward. He stands straight; he has been practicing. You place the fez in his hands. You ask him to take the Lodge oath; he accepts it, and he puts the fez on. It is slightly too large, but he does not take it off."
 ate_fez_ceremony.0002.desc.several:0 "After the Lodge finishes its sermons, you call them forward one by one: [ate_fez_boy_1.GetFirstNameNoTooltip], [ate_fez_boy_2.GetFirstNameNoTooltip], and the others after them. Each one stands as straight as he can. Each one receives the fez, crimson felt and black tassel, the same as every one of us, and hears the words of the Lodge spoken over him.\n\nEvery fez is slightly too large for them, but not one of them takes it off."
 ate_fez_ceremony.0002.desc.many:0 "I've certainly been busy these past years. There are so many of them that the brothers of the Lodge have to bring a second table for the fezzes. [ate_fez_boy_1.GetFirstNameNoTooltip] first, then [ate_fez_boy_2.GetFirstNameNoTooltip], then the rest of the line, all the way to the back of the hall. The oath of the Lodge is spoken so many times that the guests start saying it along.\n\nSome of the fezzes are a little too large for my boys' heads, but they don't take them off."
 ate_fez_ceremony.0002.a:0 "Being a Shriner is more than just wearing the fez. Remember to live by the Lodge oath."
 ate_fez_ceremony.0002.b:0 "Look at them. The finest boys in the land."
 ate_fez_ceremony.0002.c:0 "Don't worry. You'll grow into it."
 ate_fez_every_present_boy_tt:0 "Every boy who received the fez"

 # Events — ate_fez_ceremony.0003 The Banquet
 ate_fez_ceremony.0003.t:0 "The Banquet"
 ate_fez_ceremony.0003.desc.none:0 "The tables are full and the cooks have outdone themselves, but the seats kept for the boys stand empty. The feast goes on anyway. It always does. When the cups are raised, the toast is to the fezzes that wait for another day."
 ate_fez_ceremony.0003.desc.one:0 "The tables are full, the cups are full; a day like this spares no expense. At the head of the hall, my boy, now brother [ate_fez_boy_1.GetFirstNameNoTooltip], his fez on his head, gorges on the ceremonial pancakes made just for him. Then I raise my cup, and the whole hall rises with me."
 ate_fez_ceremony.0003.desc.several:0 "The tables are full, the cups are full, and the seats are full as well. At the head of the hall sit the boys: [ate_fez_boy_1.GetFirstNameNoTooltip], [ate_fez_boy_2.GetFirstNameNoTooltip], and the others, eating, every fez a little crooked by now. That's when I raise my cup, and the whole hall rises with me."
 ate_fez_ceremony.0003.a:0 "\"Fi si-já-tik!\" To the new brothers of the Lodge!"

 # TESTING ONLY — debug decision (remove before release)
 ate_fez_debug_spawn_test_kids:0 "TEST: Spawn Fez Test Children"
 ate_fez_debug_spawn_test_kids_desc:0 "TESTING ONLY. Adds 15 of your children to your court, all aged 13: 11 boys and 4 girls, each with a different pair of personality traits, to test the Feast of the Fez events. They take your faith and culture."
 ate_fez_debug_spawn_test_kids_tooltip:0 "TESTING ONLY: spawn 15 children aged 13 with different traits"
 ate_fez_debug_spawn_test_kids_confirm:0 "Spawn the children"

 # =====================================================================
 # BUILD STEP 4 — guest events (2026-10-12). Real text from fezlore.txt applied 2026-10-25 and 2026-11-16.
 # =====================================================================
 ate_fez_ceremony.1001.t:0 "Zub-dah Fingers"
 ate_fez_ceremony.1001.desc:0 "My son, my boy, a little clumsier than most, had a fez too large, and it accidentally (I hope) fell from his head to the floor. With such bad timing, he also stepped on it, carried by the momentum. The fez is now ruined. The silent crowd and I let out a surprised, unified gasp, and the silence turns from respectful to uncomfortable to unbearable.\n\n[ate_fez_target_boy.GetFirstNameNoTooltip], pale as a ghost, stiff as a board, and with his foot still on the fez, starts looking at me..."
 ate_fez_ceremony.1001.a:0 "\"Hahaha, that's not how you adjust the fez to your head, my boy.\""
 ate_fez_ceremony.1001.b:0 "I violently pull the stomped fez from under his foot and put the damaged fez on his head."
 ate_fez_ceremony.1001.c:0 "I clap my hands, and immediately the servants bring a new fez."
 ate_fez_ceremony.1001.b.tt:0 "Your son wears a broken fez."
 ate_fez_ceremony.1001.d:0 "\"It looks like the fez didn't lose its elasticity. A simple push from the inside and it's like new.\""
 ate_fez_ceremony.1001.a.toast:0 "You and the boy grow closer"

 ate_fez_ceremony.1007.t:0 "Tiny Wheels, Big Egos"
 ate_fez_ceremony.1007.desc:0 "Every Lodge has its pride, and ours is the little cars. Six brothers of the Lodge, grown men with beards and bellies, folded into six tiny painted carts with their knees up to their ears, fezzes bobbing, honking little horns as they circle the boys. The crowd loves it. The boys love it even more. Then I notice the brothers are not circling anymore. They are racing. And standing right at the next corner, waving a little crimson flag and paying no attention whatsoever, is [ate_fez_cars_victim.GetFirstNameNoTooltip]."
 ate_fez_ceremony.1007.desc.no_cars_victim:0 "Every Lodge has its pride, and ours is the little cars. Six brothers of the Lodge, grown men with beards and bellies, folded into six tiny painted carts with their knees up to their ears, fezzes bobbing, honking little horns as they circle the boys. The crowd loves it. The boys love it even more. Then I notice the brothers are not circling anymore. They are racing, and the next corner is packed with people who have not noticed yet."
 ate_fez_ceremony.1007.a:0 "Let them roll! This is what the people came to see."
 ate_fez_ceremony.1007.a.success.tt:0 "At the last second the carts swerve together, in perfect formation, as if they had planned it all along (they had not)."
 ate_fez_ceremony.1007.a.success.toast:0 "Lodge-certified driving"
 ate_fez_ceremony.1007.a.accident.tt:0 "One cart does not swerve. Somebody will be limping home from this parade."
 ate_fez_ceremony.1007.a.accident.toast:0 "Crimson road rage"
 ate_fez_ceremony.1007.b:0 "Park the carts before somebody gets flattened!"
 ate_fez_ceremony.1007.c:0 "My gold is on the red one!"
 ate_fez_ceremony.1007.c.win.tt:0 "The red cart crosses the line first, by the length of a fez."
 ate_fez_ceremony.1007.c.lose.tt:0 "The red cart loses a wheel at the last corner. So does my purse."
 ate_fez_ceremony.1007.c.win.toast:0 "Easy money"
 ate_fez_ceremony.1007.c.lose.toast:0 "The Lodge always wins"

 ate_fez_ceremony.1016.t:0 "Age Is Just a Number"
 ate_fez_ceremony.1016.desc:0 "The ceremony is about to begin when I feel an insistent tug at my tunic. When I look down, I see my beloved [ate_fez_little_brother.GetFirstNameNoTooltip], arms crossed and indignation all over his face. \"I want my fez as well! I'm not a child anymore. I've hunted, I speak properly, and I can run the house as well as anyone.\" An amused murmur runs through the hall. The boy stands tall, holding his breath, waiting for me to place the symbol of adulthood on his head before his time."
 ate_fez_ceremony.1016.a:0 "Enjoy being a child without responsibilities while it lasts, son."
 ate_fez_ceremony.1016.a.success.tt:0 "Having no responsibilities soothes him."
 ate_fez_ceremony.1016.a.success.toast:0 "Your words calm him"
 ate_fez_ceremony.1016.a.failure.tt:0 "His tantrum is interrupting the ceremony."
 ate_fez_ceremony.1016.a.failure.toast:0 "Oh, he's not having it"
 ate_fez_ceremony.1016.b:0 "Oh, but of course! If you behave, we will make one just for you."
 ate_fez_ceremony.1016.b.tt:0 "A crown fit for a little king."
 ate_fez_ceremony.1016.c:0 "I pretend not to hear him."
 ate_fez_ceremony.1016.c.tt:0 "His tantrum distracts the ceremony."
 ate_fez_ceremony.1016.d:0 "Whoop his ass."
 ate_fez_ceremony.1016.d.tt:0 "You teach him to know his place."
 ate_fez_ceremony.1016.e:0 "Make room for another man."
 ate_fez_ceremony.1016.e.tt:0 "The extent of your favoritism is revealed to everyone."
 ate_fez_ceremony.1016.e.toast:0 "Another man in the family"

 ate_fez_ceremony.1020.t:0 "Age Doesn't Imply Maturity"
 ate_fez_ceremony.1020.desc:0 "I don't know where to hide. [ate_fez_target_boy.GetFirstNameNoTooltip] is making a mess of everything. It is normal to let some of the children play during the ceremony; after all, that is what Mohammed Ali stipulated. But my son keeps playing and screaming even while the Potentate gives the sermon, and the noise doesn't stop even as we near the handing over of the crimson.\n\nNobody would be so foolish or reckless as to even look at me, for they know what could happen to them, but I can feel the discomfort of everyone in the Lodge.\n\nI want this damn ritual to end. I finally give him the fez, which he accepts without a thought or a care, and he goes to sit down... thank Allah... And just when I think my son can't disappoint me any more, he starts brawling with another child right in the middle of the final ceremony. THAT'S ENOUGH. SOMETHING NEEDS TO BE DONE."
 ate_fez_ceremony.1020.a:0 "YOU WILL BEHAVE LIKE A MAN, OR BE TREATED LIKE A BABY!"
 ate_fez_ceremony.1020.b:0 "Thrash him."
 ate_fez_ceremony.1020.c:0 "YOU ARE UNFIT TO BEHAVE LIKE A MAN! GO BACK AND SIT WITH YOUR LITTLE BROTHERS!"
 ate_fez_ceremony.1020.c.toast:0 "You take the fez off his head; he does not become a man"


 ate_fez_ceremony.1013.t:0 "She's an Adult Too"
 ate_fez_ceremony.1013.desc:0 "As the party continues, I go to the kitchen to see how the women are doing. Usually, on a day like this, all the women of the family from age 12 onward go to the kitchen with the servants to prepare all the food we are eating. Since I'm such a progressive lord, I help the ladies by carrying one (1) log of wood to the fire. Having done my part for feminism today, I am stopped by [ate_fez_daughter.GetFirstNameNoTooltip], sweat on her face from the toil of peeling potatoes, who confronts me: \"I have been educated in matters of warfare, stewardship and intrigue, just like my brothers, and you know I'm just as capable as the rest of them, even more so in fact. I want the crimson as well.\""
 ate_fez_ceremony.1013.a:0 "I cannot break tradition, but we can work something out."
 ate_fez_ceremony.1013.b:0 "I cannot break tradition just like that, my dear."
 ate_fez_ceremony.1013.b.success.tt:0 "She understands it's just a ritual."
 ate_fez_ceremony.1013.b.success.toast:0 "Disaster averted"
 ate_fez_ceremony.1013.b.failure.tt:0 "She gets angry at you."
 ate_fez_ceremony.1013.b.failure.toast:0 "So progressive you were"
 ate_fez_ceremony.1013.c:0 "Learn your place."
 ate_fez_ceremony.1013.d:0 "You make a fair point. LISTEN UP, EVERYONE!"
 ate_fez_ceremony.1013.d.toast:0 "She gets a fez ritual"
 ate_fez_ceremony.1013.e:0 "All of you deserve this as well."
 ate_fez_ceremony.1013.e.toast:0 "Just like the boys"
 ate_fez_every_new_sister_tt:0 "Every daughter who receives the fez"

 # Modifier — #13 option d
 ate_fez_broke_lodge_law_modifier:0 "Broke the Lodge's Law"
 ate_fez_broke_lodge_law_modifier_desc:0 "Believes the laws of the Lodge can be bent at will."
 ate_fez_wiped_lodge_law_modifier:0 "Wiped Their Bum with the Lodge's Law"
 ate_fez_wiped_lodge_law_modifier_desc:0 "To this lord, the laws of the Lodge are just suggestions."
 ate_fez_friend_gave_her_fez:0 "When the Lodge said no, [CHARACTER.GetShortUIName] gave [TARGET_CHARACTER.GetShortUIName] the crimson anyway."

 # Step 4, second batch — guest events (2026-10-12). Real text from fezlore.txt applied 2026-11-16.
 ate_fez_ceremony.1002.t:0 "Kids These Days"
 ate_fez_ceremony.1002.desc:0 "As the feast begins and we start eating and drinking, I can't help but notice some snarky comments coming from [ate_fez_elder_brother.GetFirstNameNoTooltip]. Everything I say gets put down by an uncalled-for comeback, or a rant about how I play favorites.\n\nAt one point in the party, I take my son aside and ask him what's wrong. \"It's nice that you now have time to love your sons. Look at the fez [ate_fez_target_boy.GetFirstNameNoTooltip] got, even made to fit his head! I had to endure a fez that was never made for me, always falling off my head. For years I could never be taken seriously. You told me it had to be like that, that it's part of the ceremony and whatnot, but now that your beloved sons become men, you spare no expense. It's nice to see you play favorites.\""
 ate_fez_ceremony.1002.a:0 "Come, sit in the seat of honor. Let me heal this."
 ate_fez_ceremony.1002.b:0 "Fez and all, and you still behave like a child."
 ate_fez_ceremony.1002.b.calm.tt:0 "You have a heavy argument with your son, but it dies there."
 ate_fez_ceremony.1002.b.rival.tt:0 "Your son resents your favoritism. Something broke today."
 ate_fez_ceremony.1002.b.calm.toast:0 "You endure the fight"
 ate_fez_ceremony.1002.b.rival.toast:0 "Butterfly effect"
 ate_fez_ceremony.1002.c:0 "Let me atone for my past mistakes."

 ate_fez_ceremony.1003.t:0 "An Uninvited Sacred Guest"
 ate_fez_ceremony.1003.desc:0 "The feast was going as planned until it was interrupted by an envoy of the Imperial Potentate. He lines up my newly fezzed sons and declares that, by order of the Imperial Divan, they have become \"Super Potentated\": a title that holds no significance whatsoever, but it excites the boys anyway. We elders know it is one of the many ploys the Potentate uses to collect a little extra in donations while investing in nothing.\n\nWe obviously give an envoy of such weight a seat, and he immediately starts eating for two. When he is finished, he takes me aside and says: \"The Imperial Potentate is most proud of your sons coming of age, but is also looking for donations to help build the most sacred Jacuzzi of the Potentate.\""
 ate_fez_ceremony.1003.a:0 "The Potentate asks, and the Potentate shall receive."
 ate_fez_ceremony.1003.b:0 "The Potentate has only our most sincere gratitude."
 ate_fez_ceremony.1003.c:0 "Ahem, your attention, please!"
 ate_fez_ceremony.1003.c.success.tt:0 "The envoy feels so flattered that he forgets the donation."
 ate_fez_ceremony.1003.c.success.toast:0 "A flattery like no other"
 ate_fez_ceremony.1003.c.failure.tt:0 "The lack of sincerity was noted."
 ate_fez_ceremony.1003.c.failure.toast:0 "An empty toast"

 ate_fez_ceremony.1004.t:0 "The Calling of Faith"
 ate_fez_ceremony.1004.desc:0 "As the feast goes on, I see [ate_fez_knight.GetFirstNameNoTooltip] talking to [ate_fez_target_boy.GetFirstNameNoTooltip]. [ate_fez_knight.GetSheHe|U] leads a holy order, and it looks like [ate_fez_knight.GetSheHe] might recruit him. My son has always been easily swayed, albeit very skillful, so I step in before something happens without my say. After the conversation has gone on for an hour, I send [ate_fez_target_boy.GetFirstNameNoTooltip] off to enjoy the party, and now I have a moment alone with [ate_fez_knight.GetFirstNameNoTooltip].\n\n\"Your son has potential,\" [ate_fez_knight.GetSheHe] says. \"Devoted defenders of our faith are very hard to find these days.\" Oh, so badly needed."
 ate_fez_ceremony.1004.a:0 "You will teach him the ropes, but he will help the faithful outside the order."
 ate_fez_ceremony.1004.a.toast:0 "[ate_fez_knight.GetFirstNameNoTooltip] trains [ate_fez_target_boy.GetFirstNameNoTooltip]"
 ate_fez_ceremony.1004.b:0 "He has responsibilities here, [ate_fez_knight.GetFirstNameNoTooltip]."
 ate_fez_ceremony.1004.c:0 "It would be an honor for [ate_fez_target_boy.GetFirstNameNoTooltip] to join the order."
 ate_fez_ceremony.1004.c.toast:0 "[ate_fez_target_boy.GetFirstNameNoTooltip] joins the holy order"

 ate_fez_ceremony.1005.t:0 "A Match Made, Calibrated, Painted, Tuned and Sealed in Heaven"
 ate_fez_ceremony.1005.desc:0 "I'm eating my way through a third batch of eggs and cracking jokes when I notice [ate_fez_suitor_family.GetFirstNameNoTooltip] laughing at all of them; whatever I say, [ate_fez_suitor_family.GetSheHe] seconds it with a cheer. The charade is starting to get uncomfortable, until [ate_fez_suitor_family.GetSheHe] is finally by my side and points: \"Look at my beautiful [ate_fez_match.GetFirstNameNoTooltip],\" [ate_fez_suitor_family.GetSheHe] says, \"and look at the chemistry [ate_fez_match.GetSheHe] has with [ate_fez_target_boy.GetFirstNameNoTooltip].\" As I look at my son, I can see that, apart from the conversation, they don't seem too interested in each other. [ate_fez_suitor_family.GetFirstNameNoTooltip] keeps chewing my ear: \"Look how beautiful and strong our descendants could be! Look how powerful our families would be!\"\n\n[ate_fez_suitor_family.GetFirstNameNoTooltip] is clearly overselling it, but I think [ate_fez_suitor_family.GetSheHe] has a point."
 ate_fez_ceremony.1005.a:0 "Arrange the betrothal."
 ate_fez_ceremony.1005.a.toast:0 "[ate_fez_target_boy.GetFirstNameNoTooltip] is betrothed to [ate_fez_match.GetFirstNameNoTooltip]"
 ate_fez_ceremony.1005.b:0 "Sadly, I have other plans for my son."

 ate_fez_ceremony.1008.t:0 "An Unusual Sight, All Too Common"
 ate_fez_ceremony.1008.desc:0 "I knew this procession was going too well to be true, until I heard a screaming man rushing toward us. I don't know why this kind of behavior is so common on this peninsula; maybe it's the water, or the number of djinn in the swamp, but this place seems to breed an eccentric bunch of people. We have been calling them Florida Men since before my grandfather was born.\n\nThis one in particular is completely naked and clearly drunk. I rally the adults and the guards to protect the children. He stamps and forces his way between the guards and starts pleading with me, in tears. \"PLEEEASE,\" he says, \"I didn't mean to kill him! You have to save him!\" He then points at a human-sized straw man he seems to be carrying. I can see genuine remorse and pain in his eyes. I can also see that the moment will soon descend into chaos if I don't do something about it."
 ate_fez_ceremony.1008.a:0 "Go to the nearest Lodge you can find. Tell them I sent you; they will treat him there."
 ate_fez_ceremony.1008.b:0 "OUT OF MY WAY, YOU DRUNKEN FOOL!"
 ate_fez_ceremony.1008.c:0 "There is nothing we can do. Join us; we will hold a funeral after my son's ceremony."
 ate_fez_ceremony.1008.a.toast:0 "Now it's someone else's problem"
 ate_fez_ceremony.1008.d:0 "I slit his throat before he utters any more nonsense."
 ate_fez_ceremony.1008.d.toast:0 "The children saw that"
 ate_fez_ceremony.1008.e:0 "MEEEEDIC... MEEEEDIC!"
 ate_fez_ceremony.1008.e.toast:0 "Now it's everyone's problem"

 ate_fez_ceremony.1009.t:0 "One Drop Too Many"
 ate_fez_ceremony.1009.desc:0 "The procession was going just as planned; so magnificent, in fact, that it started drawing in everyone who saw it. So magnificent that even the clouds started gathering. And just like that, it started pouring. Legends say that the people before the Event used to predict the weather and plan accordingly. Oh, to have such privileges now... I am lost in my head until [ate_fez_guest.GetFirstNameNoTooltip] snaps me out of it, wet as a towel, asking me what we are going to do now."
 ate_fez_ceremony.1009.desc.no_guest:0 "The procession was going just as planned; so magnificent, in fact, that it started drawing in everyone who saw it. So magnificent that even the clouds started gathering. And just like that, it started pouring. Legends say that the people before the Event used to predict the weather and plan accordingly. Oh, to have such privileges now... Well, there is no time to dwell on the past. We need to do something."
 ate_fez_ceremony.1009.a:0 "The weather will not stop this procession. We will endure!"
 ate_fez_ceremony.1009.a.success.tt:0 "Rain, snow or thunder."
 ate_fez_ceremony.1009.a.success.toast:0 "You go through it unbothered"
 ate_fez_ceremony.1009.a.ill.tt:0 "No reckless decision goes unpunished."
 ate_fez_ceremony.1009.a.ill.toast:0 "All of you catch a cold"
 ate_fez_ceremony.1009.b:0 "Quick! LET'S FIND SHELTER!"
 ate_fez_ceremony.1009.b.toast:0 "The rain passed quickly, but the lack of organization was noted"
 ate_fez_ceremony.1009.c:0 "Oh, Allah'din, it is your people trying to guide our flock. Let us through!"
 ate_fez_ceremony.1009.c.success.tt:0 "The skies clear."
 ate_fez_ceremony.1009.c.success.toast:0 "You have a divine connection"
 ate_fez_ceremony.1009.c.failure.tt:0 "The rain is still pouring."
 ate_fez_ceremony.1009.c.failure.toast:0 "Such arrogance, to think you can give orders to the supreme Allah"

 ate_fez_ceremony.1010.t:0 "The Scaly Son"
 ate_fez_ceremony.1010.desc:0 "A day to remember. The sun is high, the birds sing, [ROOT.Char.Custom('AteGatorName')] is walking around happily, and the parade and the children are scared... The parade and the children are scared? What's wrong? I ask the people around me. [ate_fez_guest.GetFirstNameNoTooltip]'s scared voice gives it to me plainly: \"Are you sure it's a good idea to let [ROOT.Char.Custom('AteGatorName')] roam that freely?\"\n\nThen I look at the people around me. It looks like not everyone is used to having a two-ton, scaly, toothed death machine walking beside them (the pusillanimous lot). The people in the procession are starting to get uncomfortable, as my scaly boy starts to growl and move more and more violently (aww, look at him, he's so happy to be here).\n\nLooks like something needs to be done."
 ate_fez_ceremony.1010.desc.no_guest:0 "A day to remember. The sun is high, the birds sing, [ROOT.Char.Custom('AteGatorName')] is walking around happily, and the parade and the children are scared... The parade and the children are scared? What's wrong? I ask the people around me. My subject says there is nothing wrong. He is clearly giving me a distracted answer, his attention fixed on every movement of [ROOT.Char.Custom('AteGatorName')].\n\nThen I look at the people around me. It looks like not everyone is used to having a two-ton, scaly, toothed death machine walking beside them (the pusillanimous lot). The people in the procession are starting to get uncomfortable, as my scaly boy starts to growl and move more and more violently (aww, look at him, he's so happy to be here).\n\nLooks like something needs to be done."
 ate_fez_ceremony.1010.a:0 "Dress him in some fine garments and send him to the head of the procession."
 ate_fez_ceremony.1010.a.success.tt:0 "The gator walks the parade fabulously."
 ate_fez_ceremony.1010.a.success.toast:0 "A sight to behold"
 ate_fez_ceremony.1010.a.bite.tt:0 "One of the guests gets bitten on the arm while trying to dress him."
 ate_fez_ceremony.1010.a.bite.toast:0 "Treat him gently, you fool!"
 ate_fez_ceremony.1010.b:0 "This moment is about the children, not about me and my gator. Sorry, [ROOT.Char.Custom('AteGatorName')]."
 ate_fez_ceremony.1010.b.toast:0 "The gator goes back to its cage"
 ate_fez_ceremony.1010.c:0 "[ROOT.Char.Custom('AteGatorName')] is part of the family at this point. I think it's long overdue that he gets his fez ritual as well."
 ate_fez_ceremony.1010.c.toast:0 "The religion is up for interpretation"
 ate_fez_every_zealous_shriner_guest_tt:0 "Every zealous Shriner at the party"
 ate_fez_every_other_guest_tt:0 "Everyone else at the party"
 ate_fez_every_mocker_family_tt:0 "The family of the murdered guest"
 ate_fez_jeweled_tassel_modifier:0 "Jeweled Tassel"
 ate_fez_jeweled_tassel_modifier_desc:0 "This character's fez finally has the finest tassel in the Lodge, a gift to make up for the years of a fez that never fit."
 ate_fez_every_other_son_tt:0 "Your other sons at the party"
 ate_fez_every_outsider_guest_tt:0 "Every guest from outside your family"
 ate_fez_every_family_guest_tt:0 "Your family at the party"
 ate_fez_friend_laughed_off_fez:0 "[CHARACTER.GetShortUIName|U] laughed it off when [TARGET_CHARACTER.GetShortUIName] stepped on [TARGET_CHARACTER.GetHerHis] fez."
 ate_fez_friend_laughed_off_fez_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] laughed it off when [CHARACTER.GetShortUIName] stepped on [CHARACTER.GetHerHis] fez."

 ate_fez_ceremony.1011.t:0 "Love from a Distance"
 ate_fez_ceremony.1011.desc:0 "While the boys are playing the famous makeshift race car game to win the fabled Red Bull goblet, an envoy of [ate_fez_ward_father.GetFirstNameNoTooltip] arrives with a gift for [ate_fez_ward.GetFirstNameNoTooltip]. It's a fez as well, with beautiful stitching, a golden horsehair tassel and a note. Such a beautiful sight. While I am admiring this marvel of fashion, [ate_fez_ward.GetFirstNameNoTooltip] appears. \"Did somebody call me?\" he says."
 ate_fez_ceremony.1011.desc.no_ward_father:0 "While the boys are playing the famous makeshift race car game to win the fabled Red Bull goblet, an envoy from the family of [ate_fez_ward.GetFirstNameNoTooltip] arrives with a gift for him. It's a fez as well, with beautiful stitching, a golden horsehair tassel and a note. Such a beautiful sight. While I am admiring this marvel of fashion, [ate_fez_ward.GetFirstNameNoTooltip] appears. \"Did somebody call me?\" he says."
 ate_fez_ceremony.1011.a:0 "Yes, I wanted to give you this beautiful fez. You are part of the family now."
 ate_fez_ceremony.1011.b:0 "Look, [ate_fez_ward.GetFirstNameNoTooltip], your family sent you a gift."
 ate_fez_ceremony.1011.c:0 "Look, [ate_fez_ward.GetFirstNameNoTooltip], look at my new fez!"

 ate_fez_ceremony.1012.t:0 "Gratitude, With Interest"
 ate_fez_ceremony.1012.desc:0 "Halfway through the feast, a servant in foreign colors makes his way to my table, dragging a chest almost as big as he is. He bows and says he comes on behalf of [ate_fez_ward_family.GetFirstNameNoTooltip], to thank me for raising [ate_fez_ward.GetFirstNameNoTooltip] as one of my own and for giving him the crimson today. He opens the chest in front of everyone: silver, fine cloth, and a letter so full of kind words that somebody must have spent a week writing it. [ate_fez_ward.GetFirstNameNoTooltip] looks at the chest, then at me, and tries very hard not to look proud. The whole table is watching me now. Everyone here knows a gift like this is never just a gift."
 ate_fez_ceremony.1012.a:0 "Tell [ate_fez_ward_family.GetFirstNameNoTooltip] the Lodge thanks them. Put it in the treasury."
 ate_fez_ceremony.1012.b:0 "Take it back. Raising [ate_fez_ward.GetFirstNameNoTooltip] was an honor, not a service."
 ate_fez_ceremony.1012.c:0 "Close the chest. Tell [ate_fez_ward_family.GetFirstNameNoTooltip] I would rather they owe me a favor."
 ate_fez_ceremony.1012.c.toast:0 "A favor is worth more than silver"

 ate_fez_ceremony.1014.t:0 "Another Match Made in Heaven"
 ate_fez_ceremony.1014.desc:0 "I am on my second plate of ceremonial pancakes and my third story about my grandfather when I notice [ate_fez_suitor_family.GetFirstNameNoTooltip] drifting closer to my table, laughing a little too hard at every joke and nodding at everything I say, even the parts nobody should agree with. I have seen this dance at every feast of my life, and sure enough, when [ate_fez_suitor_family.GetFirstNameNoTooltip] finally sits down next to me, there is a finger pointing across the hall: \"Have you seen my [ate_fez_match.GetFirstNameNoTooltip]? A fine young man. And look at him with [ate_fez_daughter.GetFirstNameNoTooltip], they were made for each other.\" I look. They are standing at a very polite distance, and [ate_fez_daughter.GetFirstNameNoTooltip] looks like she is counting the minutes until the conversation is over. [ate_fez_suitor_family.GetFirstNameNoTooltip] keeps going anyway: the alliance, the land, the grandchildren, the grandchildren again. That one could sell water to a swamp. Still... it is not the worst idea I have heard tonight."
 ate_fez_ceremony.1014.a:0 "Very well. Let us talk about the dowry."
 ate_fez_ceremony.1014.a.toast:0 "[ate_fez_daughter.GetFirstNameNoTooltip] is betrothed to [ate_fez_match.GetFirstNameNoTooltip]"
 ate_fez_ceremony.1014.b:0 "[ate_fez_daughter.GetFirstNameNoTooltip] is still young. Ask me again in a few years."

 ate_fez_ceremony.1015.t:0 "A Star Is Born"
 ate_fez_ceremony.1015.desc:0 "The cups are full and the musicians have started on the old songs when [ate_fez_daughter.GetFirstNameNoTooltip] gets up from her seat, walks to the middle of the hall, and starts to sing the hymn of the Lodge. She has clearly been practicing in secret. By the second verse the whole hall is clapping along; by the third, even the brothers of the Lodge are on their feet. Nobody is looking at the fezzes anymore. [ate_fez_target_boy.GetFirstNameNoTooltip], fez and all, sits forgotten at the head of the table with his arms crossed, glaring at his sister as if she had stolen his horse."
 ate_fez_ceremony.1015.desc.no_target_boy:0 "The cups are full and the musicians have started on the old songs when [ate_fez_daughter.GetFirstNameNoTooltip] gets up from her seat, walks to the middle of the hall, and starts to sing the hymn of the Lodge. She has clearly been practicing in secret. By the second verse the whole hall is clapping along; by the third, even the brothers of the Lodge are on their feet. Nobody is looking at the fezzes anymore. Somewhere at the head of the table, the new brothers of the Lodge are sulking."
 ate_fez_ceremony.1015.a:0 "That's my girl! Sing it again!"
 ate_fez_ceremony.1015.a.toast:0 "The boys will get over it"
 ate_fez_ceremony.1015.b:0 "Sit down, [ate_fez_daughter.GetFirstNameNoTooltip]. Today belongs to your brothers."
 ate_fez_ceremony.1015.b.toast:0 "The song ends early"

 ate_fez_ceremony.1017.t:0 "Heavy Is the Fez"
 ate_fez_ceremony.1017.desc:0 "The ceremony is about to begin. Life in this region is hard and fleeting, so the great fez rituals are shared by many families. As I line up my sons and start counting, I notice something. One... two... three... four... WHERE IS [ate_fez_target_boy.GetFirstNameNoTooltip]? I stop the ceremony and gather every adult I can see to find my boy.\n\nAfter a couple of minutes, I hear crying from one of the most secluded halls. There I find my son, crying inconsolably. We look at each other, his tears mixing with his own snot. \"Please,\" he says, \"I'm not ready to be an adult. I want to play and rest and eat forever. I don't want to lead armies or get married. I don't want the fez.\""
 ate_fez_ceremony.1017.a:0 "Be strong, boy. It is a ritual we all must endure. You will be a good adult; have faith in yourself."
 ate_fez_ceremony.1017.a.success.tt:0 "The ceremony continues."
 ate_fez_ceremony.1017.a.success.toast:0 "Your son is ready to be a man"
 ate_fez_ceremony.1017.a.failure.tt:0 "You fail to comfort him."
 ate_fez_ceremony.1017.a.failure.toast:0 "The ceremony will have an empty fez"
 ate_fez_ceremony.1017.b:0 "You will perform the duties every Neomoor man is expected to perform, starting with this ceremony. NOW."
 ate_fez_ceremony.1017.c:0 "Beat his ass."
 ate_fez_ceremony.1017.d.drunkard:0 "Oh, you silly billy, let me tell you about the perks you're missing out on."
 ate_fez_ceremony.1017.d.hashishiyah:0 "Oh, you silly billy, let me tell you about the perks you're missing out on."
 ate_fez_ceremony.1017.d.comfort_eater:0 "Oh, you silly billy, let me tell you about the perks you're missing out on."
 ate_fez_ceremony.1017.d.gluttonous:0 "Oh, you silly billy, let me tell you about the perks you're missing out on."
 ate_fez_ceremony.1017.d.profligate:0 "Oh, you silly billy, let me tell you about the perks you're missing out on."
 ate_fez_ceremony.1017.d.greedy:0 "Oh, you silly billy, let me tell you about the perks you're missing out on."
 ate_fez_ceremony.1017.d.lifestyle_reveler:0 "Oh, you silly billy, let me tell you about the perks you're missing out on."
 ate_fez_ceremony.1017.d.caught.tt:0 "He will take this conversation as a promise for when he grows up."
 ate_fez_ceremony.1017.d.enjoyed.tt:0 "You entice him with the good life adults can have."
 ate_fez_ceremony.1017.d.caught.toast:0 "The ceremony continues"
 ate_fez_ceremony.1017.d.enjoyed.toast:0 "The ceremony continues"
 ate_fez_ceremony.1017.e:0 "It's okay, [ate_fez_target_boy.GetFirstNameNoTooltip]. You don't have to be ready yet. We can try next year."
 ate_fez_ceremony.1017.e.toast:0 "Your son does not attend the ceremony"
 ate_fez_ceremony.1017.f:0 "Did I ever tell you about the things they let you get away with when you wear the crimson?"
 ate_fez_ceremony.1017.f.toast:0 "THE FUCK IS WRONG WITH YOU"

 ate_fez_ceremony.1018.t:0 "When in al-Rome..."
 ate_fez_ceremony.1018.desc:0 "We are all marching in the parade, cars going around us and carnival music blaring from left to right. Suddenly I see [ate_fez_foreign_ward.GetFirstNameNoTooltip], as happy as everyone else, dancing and singing with my sons, and dancing with the girls as well.\n\nThen he comes to me and asks, \"What are we celebrating?\" This poor soul, cursed not to have been born in Shriner arms, his soul doomed forever to rot in Duat for his blasphemous beliefs... Maybe something can be done after all. Everybody knows Allah'din works in mysterious ways; nothing is left to chance. And he is of the age to become a man... maybe something can be done."
 ate_fez_ceremony.1018.a:0 "[ate_fez_foreign_ward.GetFirstNameNoTooltip], from now on you will become a man, as my sons and I have. Embrace the truth."
 ate_fez_ceremony.1018.a.toast:0 "He happily becomes a Shriner"
 ate_fez_ceremony.1018.b:0 "It's one of our traditions. You would do well to observe how we do things."

 ate_fez_ceremony.1019.t:0 "Just Like the First Time"
 ate_fez_ceremony.1019.desc:0 "One can feel the difference in age between the eldest sons and the younger ones; adult life is clearly settling in on them. That said, one of my youngest sons, [ate_fez_target_boy.GetFirstNameNoTooltip], doesn't follow these rules. He has always been uncannily more mature and calm than his peers.\n\nI find myself talking about heavy subjects with him, until he tells me he would like to have the fez right now. I try to tell him he still needs to live a little more to become a man, and then he drops it: \"I have already lived more than enough, for I am [ate_fez_ancestor.GetFirstNameNoTooltip]. I can't explain how, but Allah has sent me back to the land of the living.\" One would just nod and let the kid live this fantasy until he forgets it, but this one feels different. He is talking about it seriously, with the seriousness of an adult telling you something. What shall I do?"
 ate_fez_ceremony.1019.a:0 "Let's get your fez right on, [ate_fez_ancestor.GetFirstNameNoTooltip]."
 ate_fez_ceremony.1019.a.toast:0 "He gets his fez again"
 ate_fez_ceremony.1019.b:0 "Reincarnation is not possible. My son is not right."
 ate_fez_ceremony.1019.b.toast:0 "Your son speaks nonsense"

 ate_fez_ceremony.1021.t:0 "A Punishment Out of Our Control"
 ate_fez_ceremony.1021.desc:0 "The ceremony is about to start, and the Potentate is beginning the first of the sermons, when I notice it. One... two... three... one of my sons is missing. I don't need to ask who, for this has become a habit of his. I cannot be so foolish as to question Allah'din's plan, but ever since [ate_fez_target_boy.GetFirstNameNoTooltip] was born with such deformities, I have wondered how he, the Supreme, or anyone could benefit from seeing my son suffer this way.\n\nI am used to him by now; to me there is no ugliness anymore. But that philosophy slams into a wall whenever we deal with anyone outside the close family. My trusted subjects and I go looking for him before the ceremony notices our absence. Eventually I find him. He is not crying, but you can see the sadness on his face, the kind of pain no child should feel. I ask him what happened.\n\n\"I don't think I deserve to become a man, for I am no man. I am a monster,\" he says, his voice about to crack. I tell him that's nonsense, that every Shriner boy must become a man, whatever his condition. And then he says, \"Even my sisters and the kennel dogs deserve the crimson more than me. [ate_fez_mocker_1.GetFirstNameNoTooltip] said so to [ate_fez_mocker_1.GetHerHis] son, and [ate_fez_mocker_2.GetFirstNameNoTooltip] laughed.\" HE SAID WHAT? \"Don't worry, Dad. Who could think I'm human, looking like this?\" He starts crying. I am not going to let that slide."
 ate_fez_ceremony.1021.desc.one_mocker:0 "The ceremony is about to start, and the Potentate is beginning the first of the sermons, when I notice it. One... two... three... one of my sons is missing. I don't need to ask who, for this has become a habit of his. I cannot be so foolish as to question Allah'din's plan, but ever since [ate_fez_target_boy.GetFirstNameNoTooltip] was born with such deformities, I have wondered how he, the Supreme, or anyone could benefit from seeing my son suffer this way.\n\nI am used to him by now; to me there is no ugliness anymore. But that philosophy slams into a wall whenever we deal with anyone outside the close family. My trusted subjects and I go looking for him before the ceremony notices our absence. Eventually I find him. He is not crying, but you can see the sadness on his face, the kind of pain no child should feel. I ask him what happened.\n\n\"I don't think I deserve to become a man, for I am no man. I am a monster,\" he says, his voice about to crack. I tell him that's nonsense, that every Shriner boy must become a man, whatever his condition. And then he says, \"Even my sisters and the kennel dogs deserve the crimson more than me. [ate_fez_mocker_1.GetFirstNameNoTooltip] said so to [ate_fez_mocker_1.GetHerHis] son.\" HE SAID WHAT? \"Don't worry, Dad. Who could think I'm human, looking like this?\" He starts crying. I am not going to let that slide."
 ate_fez_ceremony.1021.desc.no_mocker:0 "The ceremony is about to start, and the Potentate is beginning the first of the sermons, when I notice it. One... two... three... one of my sons is missing. I don't need to ask who, for this has become a habit of his. I cannot be so foolish as to question Allah'din's plan, but ever since [ate_fez_target_boy.GetFirstNameNoTooltip] was born with such deformities, I have wondered how he, the Supreme, or anyone could benefit from seeing my son suffer this way.\n\nI am used to him by now; to me there is no ugliness anymore. But that philosophy slams into a wall whenever we deal with anyone outside the close family. My trusted subjects and I go looking for him before the ceremony notices our absence. Eventually I find him. He is not crying, but you can see the sadness on his face, the kind of pain no child should feel. I ask him what happened.\n\n\"I don't think I deserve to become a man, for I am no man. I am a monster,\" he says, his voice about to crack. I tell him that's nonsense, that every Shriner boy must become a man, whatever his condition. And then he says, \"Even my sisters and the kennel dogs deserve the crimson more than me. JUST LOOK AT ME.\" These words pierce through me like ice. Then he starts crying. This calls for action."
 ate_fez_ceremony.1021.a:0 "I embrace him. \"Everybody is equal in the eyes of Allah, and in mine as well.\""
 ate_fez_ceremony.1021.b:0 "Don't worry, son. You don't have to show up today. The torture is over."
 ate_fez_ceremony.1021.b.toast:0 "Your son doesn't attend the ceremony; no one questions it"
 ate_fez_ceremony.1021.c:0 "We will hold a ceremony with just our loved ones, don't worry."
 ate_fez_ceremony.1021.c.toast:0 "The ceremony is just spectacle"
 ate_fez_ceremony.1021.d:0 "Wow, ugly AND smart. I swear, if it weren't for that, I wouldn't know you were human."
 ate_fez_ceremony.1021.d.toast:0 "Something breaks inside his heart. Watch your back"
 ate_fez_ceremony.1021.e:0 "WHO SAID THAT? POINT THEM OUT TO ME!"
 ate_fez_ceremony.1021.e.toast:0 "A fez ceremony and an execution: a reminder of whose son they were mocking"

 # Relation reasons — second batch (+ the missing _corresponding for the #13 friend reason)
 ate_fez_friend_gave_her_fez_corresponding:0 "When the Lodge said no, [TARGET_CHARACTER.GetShortUIName] gave [CHARACTER.GetShortUIName] the crimson anyway."
 ate_fez_rival_brothers_fez:0 "[TARGET_CHARACTER.GetShortUIName|U] got a fez made for [TARGET_CHARACTER.GetHerHis] head. [CHARACTER.GetShortUIName|U]'s never even fit."
 ate_fez_rival_brothers_fez_corresponding:0 "[CHARACTER.GetShortUIName|U] has hated [TARGET_CHARACTER.GetShortUIName] ever since [TARGET_CHARACTER.GetShortUIName] got a better fez than [CHARACTER.GetHerHis] own."
 ate_fez_rival_mocked_his_looks:0 "[TARGET_CHARACTER.GetShortUIName|U] mocked [CHARACTER.GetShortUIName]'s imperfections, just like everyone else."
 ate_fez_rival_mocked_his_looks_corresponding:0 "[CHARACTER.GetShortUIName|U] mocked [TARGET_CHARACTER.GetShortUIName] until [TARGET_CHARACTER.GetSheHe] hated [CHARACTER.GetHerHim]."
